# Production Configuration
# Config schema version - validates against CONFIG_VERSION environment variable
config_version: "1.0.0"

servicenow:
  instance_url: ""  # Loaded from SERVICENOW_INSTANCE_URL env var at runtime
  # ServiceNow Table API endpoint format: /api/now/table/{table_name}
  api_path: "/api/now/table"  # Base path for Table API (no version in path)
  table: "sc_request"  # Default table name
  # Query parameters for Table API
  query_params:
    sysparm_limit: 10  # Default limit for records returned
    sysparm_offset: 0  # Default offset for pagination
    sysparm_display_value: false  # Return sys_id or display values for reference fields
  # API request headers
  # For GET requests, only Accept header is required per ServiceNow Table API
  headers:
    Accept: "application/json"
  
# Application Settings
app:
  name: "SR Automation Service"
  version: "1.0.0"  # Application version (separate from config_version)
  environment: "prod"
  
# Logging Configuration
logging:
  level: "INFO"  # INFO level for production
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"

